services:
  - type: web
    name: resume-matcher-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: USE_GROQ
        value: "true"
      - key: OLLAMA_MODEL
        value: "llama3.1"
      - key: OPENAI_API_KEY
        value: "not_used"