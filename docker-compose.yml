services:
  postgres:
    image: postgres:16
    container_name: resume_matcher_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: resumematcher
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: resume_matcher_redis
    restart: always
    ports:
      - "6380:6379"

volumes:
  postgres_data: